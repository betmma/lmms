name: Build LMMS with pattern paste fix

'on':
  push:
    branches: [codex/fix-pattern-paste]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - name: Check out patched source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          path: lmms
          persist-credentials: false

      - name: Install packaging tools
        run: choco install nsis --yes --no-progress

      - name: Install Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          archives: qtbase qtsvg qttools
          cache: true

      - name: Set up MSVC
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9
        with:
          arch: x64

      - name: Configure
        working-directory: lmms
        run: |
          cmake -S . -B build -G Ninja `
            --toolchain C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DTARGET_UARCH=official `
            -DWANT_QT6=ON `
            -DUSE_COMPILE_CACHE=OFF `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_HOST_TRIPLET=x64-windows

      - name: Build
        working-directory: lmms
        run: cmake --build build

      - name: Run tests
        working-directory: lmms/build/tests
        run: ctest --output-on-failure -j2

      - name: Package Windows installer
        working-directory: lmms
        run: cmake --build build --target package

      - name: Upload patched installer
        uses: actions/upload-artifact@v7
        with:
          name: lmms-pattern-paste-fix-windows-x64
          path: lmms/build/lmms-*.exe
          if-no-files-found: error
          retention-days: 14
